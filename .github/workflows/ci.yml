# Vérification de chaque proposition de changement (pull request) AVANT sa fusion :
# tests automatiques + construction du jeu. Une version qui casse est signalée en rouge et n'est pas fusionnée.
name: Vérification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
