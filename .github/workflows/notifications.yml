# Notifications d'Aeonfall (camp plein, énergie au maximum, cadeau d'un ami), toutes les 10 minutes.
# Prérequis (une seule fois) : Settings → Secrets and variables → Actions → New repository secret
#   Nom : FIREBASE_SERVICE_ACCOUNT   Valeur : le contenu du fichier de clé du compte de service Firebase
#   (console Firebase → Paramètres du projet → Comptes de service → Générer une nouvelle clé privée).
#
# La programmation de GitHub (schedule) ne se déclenche pas toujours. Chaque lancement manuel envoie donc les
# notifications toutes les 10 minutes pendant une heure, puis relance lui-même le suivant : une chaîne continue.
# Pour la (re)démarrer : Actions → Notifications → Run workflow. Pour l'arrêter : désactiver le workflow.
name: Notifications

on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/push
      - name: Envoyer (une fois si programmé ; toutes les 10 minutes pendant une heure si lancé à la main)
        working-directory: scripts/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ROUNDS: ${{ github.event_name == 'workflow_dispatch' && '6' || '1' }}
        run: |
          for i in $(seq 1 "$ROUNDS"); do
            node send.mjs || echo "Échec de l'envoi n°$i (on continue)"
            if [ "$i" -lt "$ROUNDS" ]; then sleep 590; fi
          done
      - name: Relancer la suite de la chaîne
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notifications.yml --ref main --repo "${{ github.repository }}"
